[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]
# apps/desktop is the Svelte frontend, not a Rust crate.
# bench/ is added to members when its crates land (M-adjacent).
exclude = ["apps/desktop"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hate-agent/hate-agent"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic allows that fight the codebase's boring-and-obvious style:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
future_not_send = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
match_same_arms = "allow"
similar_names = "allow"
