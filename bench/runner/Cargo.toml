[package]
name = "hate-bench"
description = "Reproducible benchmark runner for hate-agent fixture tasks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
hate-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
