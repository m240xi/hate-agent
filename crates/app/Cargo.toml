[package]
name = "hate-app"
description = "Tauri shell for hate-agent — thin command/event adapter only"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "hate_app"

[[bin]]
name = "hate-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hate-auth = { path = "../auth" }
hate-core = { path = "../core" }
hate-ledger = { path = "../ledger" }
hate-providers = { path = "../providers" }
dirs = "6"
dunce = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "macros", "rt"] }
tokio-util = "0.7"
