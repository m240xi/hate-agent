[package]
name = "hate-cli"
description = "Headless `hate` binary — the same core the desktop app drives"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "hate"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
hate-auth = { path = "../auth" }
hate-core = { path = "../core" }
hate-ledger = { path = "../ledger" }
hate-providers = { path = "../providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webbrowser = "1"
