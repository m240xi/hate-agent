[package]
name = "hate-core"
description = "Session state machine, turn assembly, and event types for hate-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
hate-context = { path = "../context" }
hate-ledger = { path = "../ledger" }
hate-prompt = { path = "../prompt" }
http = "1"
rmcp = { version = "~3.8.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "which-command",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
