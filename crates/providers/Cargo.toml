[package]
name = "hate-providers"
description = "Provider adapters and Delta normalization for hate-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fastrand = "2"
futures-util = "0.3"
hate-context = { path = "../context" }
hate-core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "io-util", "net"] }
tokio-util = "0.7"
tracing = "0.1"
